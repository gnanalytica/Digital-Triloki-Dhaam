# Also offered, per the "Levensvragen" (spiritual care) page.
pastoral_care:
  id: geestelijke-verzorging
  name:
    nl: Geestelijke begeleiding
    en: Spiritual care and guidance
  provider: Pandit Vinay Narain
  description:
    nl: >-
      Bij Mandir Triloki Dhaam zijn er mogelijkheden voor individuele
      spirituele begeleiding en ondersteuning. Onze geestelijk verzorger kan
      samen met u nagaan of persoonlijke begeleiding past in uw situatie.
    en: >-
      Mandir Triloki Dhaam offers individual spiritual guidance and support.
      Our spiritual carer can explore with you whether personal guidance fits
      your situation.
  intake_route: email
  note: >-
    A contact form or a simple request form would serve this better than an
    e-mail address, because people asking for pastoral support often do not
    know what to write in a blank e-mail. Keep it short and make clear who
    reads it and how confidential it is.
