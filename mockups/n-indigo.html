<script>
var pick = 'first', kcat = 'mantra', fsel = null;

// ---------- Ornament ----------
// Rangoli: rings of coloured petals, the pattern drawn in powder at a doorway on festival days.
function rangoliSVG(p) {
  var out = '<circle r="108" fill="' + p[4] + '"/><circle r="100" fill="#1f2368"/>';
  function ring(n, a, b, w, fill, offset) {
    var h = b - a, path = 'M0,' + -a + 'C' + w + ',' + -(a + h * .3) + ' ' + w * .75 + ',' + -(b - h * .28) + ' 0,' + -b + 'C' + -w * .75 + ',' + -(b - h * .28) + ' ' + -w + ',' + -(a + h * .3) + ' 0,' + -a + 'Z';
    for (var i = 0; i < n; i++) out += '<path fill="' + fill + '" d="' + path + '" transform="rotate(' + (360 / n * i + (offset || 0)) + ')"/>';
  }
  ring(24, 74, 99, 7.5, p[2]);
  ring(16, 46, 78, 11, p[1], 11.25);
  ring(8, 16, 50, 13, p[0]);
  out += '<circle r="15" fill="' + p[3] + '"/><circle r="5" fill="#fff"/>';
  for (var i = 0; i < 24; i++) { var t = Math.PI * 2 * i / 24; out += '<circle cx="' + (Math.sin(t) * 104).toFixed(1) + '" cy="' + (-Math.cos(t) * 104).toFixed(1) + '" r="1.8" fill="#fff" stroke="none"/>'; }
  return out;
}
// Peacock feathers: a stem, fine barbs, and the eye in green, bronze, blue and indigo.
function feathersSVG() {
  var out = '';
  [-52, -28, -4, 20, 44].forEach(function (turn, n) {
    var long = 150 - Math.abs(n - 2) * 14, barbs = '';
    for (var i = 0; i < 16; i++) { var y = -long + 46 + i * 5.5, len = 26 - i * 1.2; barbs += '<path class="barb" d="M0 ' + y + 'q' + -len * .6 + ' ' + -6 + ' ' + -len + ' ' + -16 + 'M0 ' + y + 'q' + len * .6 + ' ' + -6 + ' ' + len + ' ' + -16 + '"/>'; }
    out += '<g transform="translate(150 215) rotate(' + turn + ')"><path class="stem" d="M0 0V' + (-long + 20) + '"/>' + barbs +
      '<ellipse cx="0" cy="' + (-long) + '" rx="23" ry="32" fill="#ffffff"/><ellipse cx="0" cy="' + (-long + 2) + '" rx="16" ry="23" fill="#d9a021"/>' +
      '<ellipse cx="0" cy="' + (-long + 4) + '" rx="11" ry="16" fill="#171a52"/><ellipse cx="0" cy="' + (-long + 8) + '" rx="6.500" ry="9" fill="#0d0f38"/></g>';
  });
  return out;
}
document.addEventListener('DOMContentLoaded', function () {
  var ns = 'http://www.w3.org/2000/svg';
  function place(parent, cls, viewBox, inner) {
    var host = document.querySelector(parent); if (!host) return;
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', cls); svg.setAttribute('viewBox', viewBox); svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = inner;
    host.insertBefore(svg, host.firstChild);
  }
  place('#wegwijs', 'rangoli rg-a', '-110 -110 220 220', rangoliSVG(['#f0d48a', '#d9a021', '#ffffff', '#d9a021', '#d9a021']));
  place('#erfgoed', 'rangoli rg-b', '-110 -110 220 220', rangoliSVG(['#f0d48a', '#d9a021', '#ffffff', '#d9a021', '#d9a021']));
  place('#samen', 'rangoli rg-c', '-110 -110 220 220', rangoliSVG(['#f0d48a', '#d9a021', '#ffffff', '#d9a021', '#d9a021']));
  place('#doneren', 'rangoli rg-d', '-110 -110 220 220', rangoliSVG(['#f0d48a', '#d9a021', '#ffffff', '#d9a021', '#d9a021']));
  place('#volg', 'feathers', '0 0 300 230', feathersSVG());
  var lamp = '';
  for (var i = 0; i < 11; i++) lamp += '<li><svg viewBox="0 0 40 50"><path class="fl" style="--n:' + i + '" d="M20 30C12 22 17 14 20 4C23 14 28 22 20 30Z"/><path class="bowl" d="M4 32h32c0 9-7 14-16 14S4 41 4 32z"/></svg></li>';
  document.getElementById('diyas').innerHTML = lamp;
});

// ---------- Heritage ----------
var jsel = 0;
function drawHeritage() {
  var M = window.MTD, H = window.MTD_HERITAGE, e = M.esc, L = M.L, t = M.t;
  var yr = function (s) { return typeof s.year === 'string' ? s.year : L(s.year); }, stop = H.journey[jsel];
  document.getElementById('route').innerHTML = '<div class="stops" role="tablist">' + H.journey.map(function (s, n) {
    return '<button type="button" role="tab" class="stop' + (s.open ? ' open' : '') + '" data-jsel="' + n + '" aria-selected="' + (n === jsel) + '"><i aria-hidden="true"></i><b>' + e(yr(s)) + '</b><span>' + e(L(s.place)) + '</span></button>';
  }).join('') + '</div><div class="stop-body" role="tabpanel"><div class="yr">' + e(yr(stop)) + '</div><div>' +
    (stop.open ? '<span class="flag">' + e(t('her_open')) + '</span>' : '') + '<h3>' + e(L(stop.title)) + '</h3><p>' + e(L(stop.body)) + '</p></div></div>';
  document.getElementById('instr').innerHTML = H.instruments.map(function (x) {
    return '<article><svg viewBox="0 0 32 32" aria-hidden="true"><path d="' + x.icon + '"/></svg><h4>' + e(L(x.name)) + '</h4><p>' + e(L(x.body)) + '</p><button type="button" disabled>' + e(t('music_soon')) + '</button></article>';
  }).join('');
  document.getElementById('slots').innerHTML = new Array(4).join('<div class="slot">' + e(t('voices_empty')) + '</div>');
  document.getElementById('phagwa-toggle').textContent = t(document.body.classList.contains('phagwa') ? 'phagwa_off' : 'phagwa_on');
  // Jhandis: the flags on bamboo poles raised after a puja. Drawn once.
  var jh = document.getElementById('jhandi');
  if (!jh.childNodes.length) {
    var tall = [38, 14, 50, 24, 8, 42, 20], tint = ['#f0d48a', '#d9a021', '#d9a021'], out = '';
    tall.forEach(function (top, n) {
      var x = 14 + n * 32;
      out += '<line x1="' + x + '" y1="' + top + '" x2="' + x + '" y2="128"/><path style="--n:' + n + ';transform-origin:' + x + 'px ' + (top + 9) + 'px" fill="' + tint[n % 3] + '" d="M' + x + ' ' + (top + 1) + 'l27 8-27 8z"/>';
    });
    jh.innerHTML = out;
  }
}

// Words a newcomer may not know get a dotted underline; tapping one explains it. Not applied in Hindi, where
// these are ordinary words.
var glossBox = null;
function glossify() {
  var M = window.MTD, G = window.MTD_HERITAGE.glossary;
  if (glossBox) glossBox.hidden = true;
  if (M.lang() === 'hi') return;
  var words = Object.keys(G).sort(function (a, b) { return b.length - a.length; });
  var find = new RegExp('(^|[^A-Za-z\u00C0-\u00FF])(' + words.join('|') + ')(?![A-Za-z\u00C0-\u00FF])', 'gi');
  document.querySelectorAll('main p, main li').forEach(function (el) {

// ---------- The year ring ----------
// 1 January is at the top and the year runs clockwise. Each festival is a marker at its own date.
function ringSVG(fests, next, chosen, today) {
  var M = window.MTD, e = M.esc, L = M.L;
  var deg = function (d) { return (Math.round((d - new Date(2026, 0, 1)) / 864e5) / 365) * 360; };
  var at = function (r, a) { var t = a * Math.PI / 180; return [(r * Math.sin(t)).toFixed(1), (-r * Math.cos(t)).toFixed(1)]; };
  var out = '<circle class="inner-track" r="124"/><circle class="track" r="150"/>';
  for (var m = 0; m < 12; m++) {
    var a = deg(new Date(2026, m, 1)), p = at(158, a), q = at(168, a), lab = at(184, deg(new Date(2026, m, 16)));
    out += '<line class="tick" x1="' + p[0] + '" y1="' + p[1] + '" x2="' + q[0] + '" y2="' + q[1] + '"/>' +
      '<text class="mlabel' + (today.getFullYear() === 2026 && today.getMonth() === m ? ' now' : '') + '" x="' + lab[0] + '" y="' + lab[1] + '">' + e(M.fmt(new Date(2026, m, 1), { month: 'short' })) + '</text>';
  }
  if (today.getFullYear() === 2026) { var t0 = at(112, deg(today)), t1 = at(160, deg(today)); out += '<line class="today" x1="' + t0[0] + '" y1="' + t0[1] + '" x2="' + t1[0] + '" y2="' + t1[1] + '"/>'; }
  var last = null, inner = false;
  fests.forEach(function (x) {
    var d0 = M.day(x.date), a0 = deg(d0), r = 150;
    // Markers within nine days of the one before step onto the inner track so they do not collide.
    if (last !== null && a0 - last < 9) inner = !inner; else inner = false;
    if (inner) r = 124;
    last = a0;
    if (x.end) { var s = at(r, a0), en = at(r, deg(M.day(x.end))); out += '<path class="span" d="M' + s[0] + ',' + s[1] + 'A' + r + ',' + r + ' 0 0 1 ' + en[0] + ',' + en[1] + '"/>'; }
    var c = at(r, a0);
    out += '<g class="mk' + (x.past ? ' past' : '') + (next && next.id === x.id ? ' next' : '') + '" data-fsel="' + x.id + '" role="button" tabindex="0" aria-pressed="' + (chosen.id === x.id) + '" aria-label="' + e(L(x.name)) + ', ' + e(M.range(x)) + '" transform="translate(' + c[0] + ' ' + c[1] + ')">' +
      '<circle r="15" fill="transparent"/><circle class="halo" r="13"/><circle class="dot" r="7.500"/></g>';
  });
  // New and full moons round the outside (calculated; see shared/extras.js).
  window.MTD_EXTRAS.moons(2026).forEach(function (mn) {
    var p = at(204, deg(mn.date));
    out += '<circle class="' + (mn.type === 'new' ? 'moon-n' : 'moon-f') + '" cx="' + p[0] + '" cy="' + p[1] + '" r="4.200"/>';
  });
  return '<svg viewBox="-214 -214 428 428" role="group">' + out + '</svg>';
}

    '<p class="meta">' + (chosen.past ? e(t('past')) : e(M.fmt(cd, { weekday: 'long' })) + ', ' + e(t('from')) + ' ' + chosen.time) + (chosen.note ? '. ' + e(L(chosen.note)) + '.' : '') + '</p>' +
    (chosen.pending ? '<p><span class="flag" style="margin:0">' + e(t('to_confirm')) + '</span></p>' : '') +
    (explain[chosen.id] && about[explain[chosen.id]] ? '<p>' + e(L(about[explain[chosen.id]])) + '</p>' : '') +
    (chosen.nights ? lampsHTML(chosen) : '') + calHTML(chosen);

  // The stream is only redrawn when the language changes, so a playing video survives other interactions.
  if (feed.lang !== M.lang()) {
    feed.lang = M.lang();
    document.getElementById('feed-chips').innerHTML = FEED_TYPES.map(function (k) {
      return '<button class="feed-chip" data-feed="' + k + '" aria-pressed="' + (feed.filter === k) + '">' + e(t('feed_' + k)) + '</button>';
    }).join('');
    drawFeed();
  }
  drawExtras(chosen);
  drawHeritage();
  glossify();
  // Keep the copy of the opening screen in step with the real one (language, dates, lamps).
  var copy = document.getElementById('loop-intro');
  copy.innerHTML = document.querySelector('main .intro').innerHTML.replace(/ id="[^"]*"/g, '');
  copy.querySelectorAll('.rv').forEach(function (el) { el.classList.remove('rv'); });
}

// ---------- The stream ----------
// Everything the mandir publishes, in one feed: the year's festivals (what is coming first, then what has been),
// the mantras, the videos and the Instagram posts. A few are shown, and more are added each time the reader
// nears the end. It stops when there is nothing left; it never repeats or pads itself to look endless.
var FEED_TYPES = ['fest', 'verse', 'video', 'ig'], FEED_BATCH = 6;
var feed = { shown: 0, filter: null, cols: 0, lang: null };

function feedItems() {
  var M = window.MTD, D = M.data, K = window.MTD_KNOWLEDGE, e = M.esc, L = M.L, t = M.t;
  var all = M.festivals();
  var fests = all.filter(function (f) { return !f.past; }).concat(all.filter(function (f) { return f.past; }).reverse());
  var groups = {
    fest: fests.map(function (f) {
      return '<article class="card card-fest' + (f.past ? ' past' : '') + '"><small>' + e(t('feed_fest')) + '</small><span class="when">' + e(M.range(f)) + '</span><h3>' + e(L(f.name)) + '</h3>' +
        '<p class="muted">' + (f.past ? e(t('past')) : e(t('from')) + ' ' + f.time + (f.note ? ', ' + e(L(f.note)).toLowerCase() : '')) + '</p>' +
        (f.pending ? '<p><span class="flag" style="margin:0">' + e(t('to_confirm')) + '</span></p>' : '') + '</article>';
    }),
    verse: K.items.filter(function (k) { return k.verse; }).map(function (k) {
      return '<article class="card card-verse"><small>' + e(t('feed_verse')) + '</small><h3>' + e(L(k.title)) + '</h3>' +
        '<div class="verse' + (k.verse.length < 3 ? ' one' : '') + '" lang="sa">' + e(k.verse) + '</div><div class="roman" lang="sa-Latn">' + e(k.roman) + '</div></article>';
    }),
    video: D.videos.map(function (v) {
      var label = e(t('s_play')) + ': ' + e(L(v.title));
      // A published artifact cannot embed YouTube, so there the thumbnail links out instead.
      var media = window.MTD_ARTIFACT
        ? '<a class="video" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=' + v.id + '" aria-label="' + label + '"><img loading="lazy" alt="" src="assets/yt-' + v.id + '.jpg"></a>'
        : '<button class="video" data-video="' + v.id + '" aria-label="' + label + '"><img loading="lazy" alt="" src="assets/yt-' + v.id + '.jpg"></button>';
      return '<article class="card card-media">' + media + '<small>YouTube</small><h3>' + e(L(v.title)) + '</h3></article>';
    }),
    ig: D.instagram.map(function (g) {
      var when = M.fmt(g.date, { day: 'numeric', month: 'long', year: 'numeric' });
      return '<article class="card card-media"><a class="gram" target="_blank" rel="noopener" href="https://www.instagram.com/reel/' + g.id + '/" aria-label="' + e(t('s_ig_open')) + ': ' + e(when) + '">' +
        '<span><img loading="lazy" alt="" src="assets/ig-' + g.id + '.jpg"></span></a><small>Instagram</small><h3>' + e(when) + '</h3></article>';
    })
  };
  if (feed.filter) return groups[feed.filter];
  // Mixed: take one of each kind in turn until every kind runs out.
  var out = [], more = true;
  for (var i = 0; more; i++) {
    more = false;
    FEED_TYPES.forEach(function (k) { if (groups[k][i]) { out.push(groups[k][i]); more = true; } });
  }
  return out;
}

function feedCols() { var w = document.getElementById('feed').clientWidth; return w >= 900 ? 3 : w >= 560 ? 2 : 1; }

// Each card goes to whichever column is shortest, so cards already on screen never move when more arrive.
function feedPlace(list, animate) {
  var cols = document.querySelectorAll('.feed-col');
  list.forEach(function (html) {
    var col = cols[0];
    cols.forEach(function (c) { if (c.offsetHeight < col.offsetHeight) col = c; });
    col.insertAdjacentHTML('beforeend', html);
    if (animate) {
      var card = col.lastElementChild;
      card.classList.add('new');
      requestAnimationFrame(function () { requestAnimationFrame(function () { card.classList.remove('new'); }); });
    }
  });
}

function feedStatus(total) {
  var done = feed.shown >= total;
  document.getElementById('feed-more').classList.toggle('done', done);
  document.getElementById('feed-status').textContent = window.MTD.t(done ? 'feed_end' : 'feed_loading');
}

// Redraw what is already shown (first load, language change, filter change, or a change in column count).
function drawFeed(reset) {
  var items = feedItems(), el = document.getElementById('feed');
  feed.shown = Math.min(items.length, reset ? FEED_BATCH : Math.max(feed.shown, FEED_BATCH));
  feed.cols = feedCols();
  el.innerHTML = new Array(feed.cols + 1).join('<div class="feed-col"></div>');
  feedPlace(items.slice(0, feed.shown), false);
  feedStatus(items.length);
}

function feedMore() {
  var items = feedItems();
  if (feed.shown >= items.length) return;
  var next = items.slice(feed.shown, feed.shown + FEED_BATCH);
  feed.shown += next.length;
  feedPlace(next, true);
  feedStatus(items.length);
}

document.addEventListener('DOMContentLoaded', function () {
  document.documentElement.classList.add('js');
  setInterval(drawSunday, 30000);
  var more = document.getElementById('feed-more');
  var nearEnd = new IntersectionObserver(function (entries) {
    if (!entries[0].isIntersecting) return;
    feedMore();
    // Ask again in a moment: if the new cards did not push the end out of view, the next batch follows.
    nearEnd.unobserve(more);
    setTimeout(function () { nearEnd.observe(more); }, 350);
  }, { rootMargin: '0px 0px 300px 0px' });
  nearEnd.observe(more);
  window.addEventListener('resize', function () { if (feedCols() !== feed.cols) drawFeed(); });

  // Header shrinks after the first scroll, the gold line tracks how far down the page the reader is.
  var top = document.getElementById('top'), bar = document.getElementById('progress'), toTop = document.getElementById('to-top'), ticking = false;
  function onScroll() {
    ticking = false;
    var y = window.scrollY, loop = document.getElementById('loop'), film = document.getElementById('film');
    var max = loop.offsetTop - top.offsetHeight;
    // The wheel: once the copy of the opening screen sits exactly where the real one does, we are at the top again.
    if (y >= max) {
      window.scrollTo({ top: 0, behavior: 'instant' });
      film.currentTime = 0;
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) film.play().catch(function () {});
      y = 0;
    }
    bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
    toTop.hidden = y < window.innerHeight;
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  onScroll();
  toTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // The menu marks the section the reader is in.
  var links = {};
  document.querySelectorAll('.nav a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
  var spy = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) Object.keys(links).forEach(function (id) { links[id].setAttribute('aria-current', String(id === en.target.id)); });
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  Object.keys(links).forEach(function (id) { var s = document.getElementById(id); if (s) spy.observe(s); });

  // Blocks ease in the first time they are seen.
  var seen = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); seen.unobserve(en.target); } });
  }, { rootMargin: '0px 0px -12% 0px' });
  if (document.visibilityState === 'visible') document.querySelectorAll('.intro > *, .band h2, .arcade, .panel, .year, .chips, .library, .trio > div, .accounts, .give > div, .foot > div').forEach(function (el) {
    el.classList.add('rv'); seen.observe(el);
  });
});

// The film loops for as long as the page is open, so it gets a pause control, and it does not start by itself for viewers who ask for reduced motion.
(function () {
  var film = document.getElementById('film'), toggle = document.getElementById('film-toggle');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { film.removeAttribute('autoplay'); film.pause(); }
  toggle.addEventListener('click', function () { if (film.paused) film.play(); else film.pause(); });
  ['play', 'pause'].forEach(function (name) { film.addEventListener(name, function () { toggle.textContent = window.MTD.t(film.paused ? 'film_play' : 'film_pause'); }); });
})();

// Ring markers are SVG groups acting as buttons, so they need Enter and Space wired by hand.
document.addEventListener('keydown', function (ev) {
  var mk = ev.target.closest && ev.target.closest('.mk');
  if (mk && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); mk.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});

document.addEventListener('click', function (ev) {
  var term = ev.target.closest('.term');
  if (term) { showGloss(term); return; }
  if (glossBox && !ev.target.closest('.gloss')) glossBox.hidden = true;
  var stopBtn = ev.target.closest('[data-jsel]');
  if (stopBtn) { jsel = Number(stopBtn.dataset.jsel); render(); document.querySelector('[data-jsel="' + jsel + '"]').focus(); return; }
  if (ev.target.closest('#phagwa-toggle')) {
    var on = document.body.classList.toggle('phagwa'), pb = document.getElementById('phagwa-toggle');
    pb.setAttribute('aria-pressed', String(on));
    pb.textContent = window.MTD.t(on ? 'phagwa_off' : 'phagwa_on');
    return;
  }
  if (ev.target.closest('#voice-toggle')) {
    var vf = document.getElementById('voice-form'), vb = document.getElementById('voice-toggle');
    vf.hidden = !vf.hidden;
    vb.setAttribute('aria-expanded', String(!vf.hidden));
    if (!vf.hidden) document.getElementById('voice-name').focus();
    return;
  }
  var copyBtn = ev.target.closest('#motd-copy');
  if (copyBtn) {
    var done = function () { copyBtn.textContent = window.MTD.t('copied'); };
    if (navigator.clipboard) navigator.clipboard.writeText(copyBtn.dataset.text).then(done, done); else done();
    return;
  }
  if (ev.target.closest('#ics-btn')) {
    var link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([yearICS()], { type: 'text/calendar' }));
    link.download = 'mandir-triloki-dhaam-2026.ics';
    link.click();
    return;
  }
  var mark = ev.target.closest('[data-fsel]');
  if (mark) { fsel = mark.dataset.fsel; render(); var again = document.querySelector('.mk[data-fsel="' + fsel + '"]'); if (again) again.focus(); return; }
  var chip = ev.target.closest('[data-feed]');
  if (chip) {
    feed.filter = feed.filter === chip.dataset.feed ? null : chip.dataset.feed;
    document.querySelectorAll('[data-feed]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.feed === feed.filter)); });
    drawFeed(true);
    return;
  }
  var k = ev.target.closest('[data-kcat]');
  if (k) { kcat = k.dataset.kcat; render(); document.querySelector('[data-kcat="' + kcat + '"]').focus(); return; }
  var v = ev.target.closest('[data-video]');
  if (v) {
    var frame = document.createElement('iframe');
    frame.src = 'https://www.youtube-nocookie.com/embed/' + v.dataset.video + '?autoplay=1';
    frame.allow = 'autoplay; encrypted-media; picture-in-picture';
    frame.allowFullscreen = true;
    frame.title = v.getAttribute('aria-label');
    v.replaceWith(frame);
    return;
  }
  var b = ev.target.closest('[data-pick], [data-goto]');
  if (!b) return;
  pick = b.dataset.pick || b.dataset.goto;
  render();
  if (b.dataset.goto) { document.getElementById('wegwijs').scrollIntoView(); document.getElementById('panel').focus({ preventScroll: true }); }
  else document.querySelector('[data-pick="' + pick + '"]').focus();
});
document.getElementById('arcade').addEventListener('keydown', function (ev) {
  if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
  ev.preventDefault();
  var i = NICHES.findIndex(function (n) { return n.id === pick; });
  pick = NICHES[(i + (ev.key === 'ArrowRight' ? 1 : NICHES.length - 1)) % NICHES.length].id;
  render();
  document.querySelector('[data-pick="' + pick + '"]').focus();
});
</script>
